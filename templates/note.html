{% extends "base.html" %}
{% block title %}{{ note.title }} · Сервис А{% endblock %}
{% block content %}
  <article>
    <h1>{{ note.title }}</h1>
    <p>Создана <time datetime="{{ note.created_at.replace(' ', 'T') }}Z">{{ note.created_at }} UTC</time></p>
    <p class="note-body">{{ note.body }}</p>
  </article>
  <p><a href="{{ url_for('index') }}">К списку заметок</a></p>
{% endblock %}
