{% extends "base.html" %}
{% block content %}
  <section>
    <h1>Новая заметка</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('create_note') }}">
      <label for="title">Заголовок</label>
      <input id="title" name="title" maxlength="100" required value="{{ title | default('') }}">
      <label for="body">Текст</label>
      <textarea id="body" name="body" rows="5" maxlength="5000" required>{{ body | default('') }}</textarea>
      <button type="submit">Сохранить</button>
    </form>
  </section>
  <section>
    <h2>Все заметки</h2>
    <p>Всего заметок: {{ notes | length }}</p>
    <ul>
      {% for note in notes %}
        <li><a href="{{ url_for('show_note', note_id=note.id) }}">{{ note.title }}</a></li>
      {% else %}
        <li>Здесь появятся сохранённые заметки.</li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
