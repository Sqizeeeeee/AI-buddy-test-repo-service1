[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy-service-a"
version = "0.1.0"
description = "A demo notes app for AI-buddy"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
lint = ["ruff==0.11.13"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
py-modules = ["app", "notes"]
packages = ["templates", "static"]

[tool.setuptools.package-data]
templates = ["*.html"]
static = ["*.css"]
