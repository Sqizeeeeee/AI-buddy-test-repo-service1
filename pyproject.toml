[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy-service-a"
version = "0.1.0"
description = "A demo notes app for AI-buddy"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[tool.setuptools]
py-modules = ["app", "notes"]
packages = ["templates", "static"]

[tool.setuptools.package-data]
templates = ["*.html"]
static = ["*.css"]
